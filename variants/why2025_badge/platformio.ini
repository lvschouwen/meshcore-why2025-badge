; WHY2025 badge variant
; requires soldering 2 pins between the esp32-C6 and the lora chip as shown here: https://wiki.why2025.org/Project:Meshtastic_on_the_WHY2025_badge
; also requires wiping the esp32-P4, or flashing it with modified BadgeVMS (coming soon)
; Connect an external antenna to your badge otherwise, it may be damaged!

[WHY2025_badge]
extends = esp32c6_base
board = esp32-c6-devkitm-1
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
build_flags =
  ${esp32c6_base.build_flags}
  -I variants/why2025_badge
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D P_LORA_SCLK=6
  -D P_LORA_MISO=2
  -D P_LORA_MOSI=7
  -D P_LORA_NSS=4
  -D P_LORA_DIO_1=5
  -D P_LORA_BUSY=11
  -D P_LORA_RESET=1
  -D SX126X_TXEN=3
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D DISABLE_WIFI_OTA=1
build_src_filter = ${esp32c6_base.build_src_filter}
  +<../variants/why2025_badge>
  +<WHY2025Board.cpp>

[env:WHY2025_badge_repeater_]
extends = WHY2025_badge
build_src_filter = ${WHY2025_badge.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${WHY2025_badge.build_flags}
  -D ADVERT_NAME='"WHY2025 Badge Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps =
  ${WHY2025_badge.lib_deps}
;  ${esp32_ota.lib_deps}

[env:WHY2025_badge_companion_radio_ble_]
extends = WHY2025_badge
build_flags = ${WHY2025_badge.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${WHY2025_badge.build_src_filter}
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/ESPNOWRadio.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${WHY2025_badge.lib_deps}
  densaugeo/base64 @ ~1.4.0

; USB support works with the bottom USB port, not the left port
[env:WHY2025_badge_companion_radio_usb_]
extends = WHY2025_badge
build_flags =
  ${WHY2025_badge.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${WHY2025_badge.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${WHY2025_badge.lib_deps}
  densaugeo/base64 @ ~1.4.0
